name: E2E Poker

on:
  push:
    paths:
      - "poker/**"
      - "server/**"
      - "api/**"
      - "tests/**"
      - "migrations/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "scripts/dev-server.ts"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: poker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (with system deps)
        run: npx playwright install --with-deps chromium

      - name: Unit + API tests
        run: npm test
        env:
          # setup-env.ts (vitest setupFiles) overwrites DATABASE_URL
          # UNCONDITIONALLY from POKER_TEST_DATABASE_URL — that is the var
          # that actually takes effect. DATABASE_URL is set too for anything
          # reading it before setup-env runs.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/poker_test
          POKER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/poker_test

      - name: E2E (Playwright — isolated harness on :8790)
        run: npm run e2e
        env:
          # The harness boots its OWN server on :8790 (POKER_E2E_PORT) and
          # never reuses a running one. PUBLIC_APP_ORIGIN must match that
          # port: the server rejects mutations whose Origin differs (CSRF).
          POKER_E2E_PORT: "8790"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/poker_test
          POKER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/poker_test
          PUBLIC_APP_ORIGIN: http://localhost:8790

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
